<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check your model download</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
  <style>
    :root { --ink: #1f2421; --muted: #59615c; --line: #c9d0cb; --page: #f6f7f5; --primary: #1d6b57; --primary-soft: #e6f0ec; --pass: #1e6b3a; --pass-bg: #e8f3ec; --fail: #b42318; --fail-bg: #fbeceb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background-color: var(--page); background-image: radial-gradient(var(--line) 1.2px, transparent 1.2px); background-size: 22px 22px; color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 64rem; margin: 0 auto; padding: 5rem 1.5rem; display: grid; gap: 3rem; }
    @media (min-width: 56rem) { main { grid-template-columns: 1fr 1.1fr; align-items: start; gap: 5rem; padding-top: 8rem; } }
    h1 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: clamp(2.25rem, 5vw, 3.25rem); line-height: 1.05; margin: 0 0 1.25rem; }
    .intro { color: var(--muted); margin: 0 0 1rem; max-width: 30rem; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 1.75rem; }
    .drop { position: relative; display: block; padding: 3rem 1.5rem; border: 2px dashed var(--line); border-radius: 8px; text-align: center; cursor: pointer; }
    .drop:hover, .drop:focus-within, .drop.over { border-color: var(--primary); background: var(--primary-soft); }
    .drop input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .drop strong { display: block; font-size: 1.15rem; }
    .drop span { color: var(--muted); }
    .drop .browse { color: var(--primary); font-weight: 600; text-decoration: underline; }
    button { margin-top: 1rem; width: 100%; padding: 0.75rem; border: 0; border-radius: 6px; background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .note { margin: 1rem 0 0; font-size: 0.95rem; color: var(--muted); }
    .result { margin-bottom: 1.5rem; padding: 1.5rem; border-radius: 8px; }
    .result h2 { display: flex; align-items: center; gap: 0.75rem; margin: 0 0 0.75rem; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 1.6rem; line-height: 1.2; }
    .mark { flex: none; display: grid; place-items: center; width: 2.25rem; height: 2.25rem; border-radius: 50%; background: var(--ink); color: #fff; font-size: 1.25rem; }
    .result p { margin: 0.25rem 0 0; }
    .file { font-family: ui-monospace, Consolas, monospace; font-size: 0.95rem; word-break: break-all; color: var(--muted); }
    .pass { background: var(--pass-bg); }
    .pass h2 { color: var(--pass); }
    .pass .mark { background: var(--pass); }
    .fail { background: var(--fail-bg); }
    .fail h2 { color: var(--fail); }
    .fail .mark { background: var(--fail); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Check your model download</h1>
      <p class="intro">Confirm your file is the one we published.</p>
    </header>

    <div class="panel">
      {% if result %}
      <section class="result {{ 'pass' if result[0] else 'fail' }}" aria-live="polite">
        <h2><span class="mark" aria-hidden="true">{{ '✓' if result[0] else '✕' }}</span>{{ 'Verified' if result[0] else 'Not verified' }}</h2>
        {% if filename %}<p class="file">{{ filename }}</p>{% endif %}
        <p>{{ result[1] }} <strong>{{ result[2] }}</strong></p>
      </section>
      {% endif %}

      <form method="post" enctype="multipart/form-data">
        <label class="drop">
          <input name="binary" type="file" required onchange="this.form.submit()">
          <strong>{{ 'Check another file' if result else 'Drop your file here' }}</strong>
          <span>or <span class="browse">choose a file</span></span>
        </label>
        <noscript><button type="submit">Check file</button></noscript>
      </form>
      <p class="note">Your file is never run or stored.</p>
    </div>
  </main>
  <script>
    const drop = document.querySelector(".drop");
    ["dragenter", "dragover"].forEach(e => drop.addEventListener(e, () => drop.classList.add("over")));
    ["dragleave", "drop"].forEach(e => drop.addEventListener(e, () => drop.classList.remove("over")));
  </script>
</body>
</html>
